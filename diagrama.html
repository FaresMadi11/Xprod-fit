<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGP – Diagrama de Flujo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0f1a;font-family:'Segoe UI',sans-serif;min-height:100vh;overflow-x:auto}
h1{text-align:center;color:#fff;padding:28px 0 8px;font-size:1.3rem;letter-spacing:2px;text-transform:uppercase;opacity:.8}
#canvas-wrap{display:flex;justify-content:center;padding:20px}
svg{overflow:visible}

/* Node base */
.node{cursor:pointer;transition:filter .2s}
.node:hover{filter:drop-shadow(0 0 14px #5eead4)}

/* Shapes */
.pill{fill:#1e2235;stroke:#5eead4;stroke-width:1.5;rx:20}
.diamond{fill:#1e2235;stroke:#f59e0b;stroke-width:1.5}
.rect{fill:#1e2235;stroke:#818cf8;stroke-width:1.5;rx:8}
.oval-start{fill:#5eead4;stroke:none}
.oval-end{fill:#f87171;stroke:none}

/* Text */
.lbl{fill:#e2e8f0;font-size:10px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.lbl-start{fill:#0d0f1a;font-weight:700;font-size:11px;text-anchor:middle;dominant-baseline:middle}

/* Lines */
.arrow{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#arrowhead)}
.arrow-yes{stroke:#4ade80;stroke-width:1.5;fill:none;marker-end:url(#arrowhead-yes)}
.arrow-no{stroke:#f87171;stroke-width:1.5;fill:none;marker-end:url(#arrowhead-no)}

/* Tooltip */
#tip{position:fixed;background:#1e2235;border:1px solid #5eead4;color:#e2e8f0;padding:8px 14px;border-radius:10px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:99}

/* Legend */
.legend{display:flex;gap:18px;justify-content:center;padding-bottom:20px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:6px;color:#94a3b8;font-size:12px}
.leg span{width:14px;height:14px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<h1>Sistema de Gestión – Diagrama de Flujo</h1>
<div class="legend">
  <div class="leg"><span style="background:#5eead4"></span>Proceso / Pantalla</div>
  <div class="leg"><span style="background:#f59e0b"></span>Decisión</div>
  <div class="leg"><span style="background:#818cf8"></span>Acción/Sub-proceso</div>
  <div class="leg"><span style="background:#4ade80"></span>Sí</div>
  <div class="leg"><span style="background:#f87171"></span>No / Fin</div>
</div>
<div id="canvas-wrap">
<svg id="flow" width="1100" height="1600" viewBox="0 0 1100 1600">
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0,8 3,0 6" fill="#475569"/>
  </marker>
  <marker id="arrowhead-yes" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0,8 3,0 6" fill="#4ade80"/>
  </marker>
  <marker id="arrowhead-no" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <polygon points="0 0,8 3,0 6" fill="#f87171"/>
  </marker>
</defs>

<!-- ══════════ ARROWS ══════════ -->
<!-- Start → Decision usuario -->
<line class="arrow" x1="550" y1="55" x2="550" y2="88"/>
<!-- Decision → Cliente -->
<line class="arrow" x1="630" y1="110" x2="780" y2="110"/>
<!-- Decision → Entrenador -->
<line class="arrow" x1="550" y1="132" x2="550" y2="168"/>

<!-- ENTRENADOR branch -->
<line class="arrow" x1="180" y1="110" x2="180" y2="168" />
<line class="arrow" x1="550" y1="132" x2="180" y2="132"/>
<line class="arrow" x1="180" y1="132" x2="180" y2="168"/>
<!-- Dashboard Ent → Decision Accion -->
<line class="arrow" x1="180" y1="208" x2="180" y2="248"/>
<!-- Accion Ent → Ver Lista -->
<line class="arrow" x1="100" y1="270" x2="100" y2="318"/>
<!-- Accion Ent → Ver Perfil -->
<line class="arrow-yes" x1="180" y1="292" x2="180" y2="318"/>
<!-- Lista Clientes → Muestra Lista -->
<line class="arrow" x1="100" y1="358" x2="100" y2="398"/>
<!-- Muestra lista → Decision volver -->
<line class="arrow" x1="100" y1="428" x2="100" y2="468"/>
<!-- volver → Sí → Ver Perfil Cliente -->
<line class="arrow-yes" x1="100" y1="490" x2="100" y2="528"/>
<!-- Perfil → Mostrar Datos -->
<line class="arrow" x1="100" y1="568" x2="100" y2="598"/>
<!-- Datos → Decision Accion Ent -->
<line class="arrow" x1="100" y1="638" x2="100" y2="678"/>
<!-- Accion: Asignar Rutina -->
<line class="arrow-yes" x1="100" y1="700" x2="100" y2="738"/>
<!-- Accion: Actualizar Datos -->
<line class="arrow" x1="180" y1="690" x2="240" y2="690"/>
<line class="arrow" x1="240" y1="690" x2="240" y2="738"/>
<!-- Crear Rutina → Guardar -->
<line class="arrow" x1="100" y1="778" x2="100" y2="818"/>
<!-- Actualizar → (end branch) -->
<line class="arrow" x1="240" y1="778" x2="240" y2="818"/>

<!-- CLIENTE branch (x=780) -->
<line class="arrow" x1="780" y1="140" x2="780" y2="168"/>
<!-- Dashboard Cliente → Decision Accion -->
<line class="arrow" x1="780" y1="208" x2="780" y2="248"/>
<!-- Accion → Ver Rutina Día -->
<line class="arrow" x1="700" y1="270" x2="700" y2="318"/>
<!-- Accion → Registrar Cliente -->
<line class="arrow" x1="780" y1="292" x2="780" y2="318"/>
<!-- Accion → Notificaciones -->
<line class="arrow" x1="860" y1="270" x2="860" y2="318"/>
<!-- Accion → Cerrar Sesión -->
<line class="arrow" x1="940" y1="270" x2="940" y2="318"/>
<!-- Accion → Ver Perfil -->
<line class="arrow" x1="1020" y1="270" x2="1020" y2="318"/>

<!-- Rutina Día → Lista Ejercicios -->
<line class="arrow" x1="700" y1="358" x2="700" y2="398"/>
<!-- Lista → Anotar Sesiones? -->
<line class="arrow" x1="700" y1="438" x2="700" y2="468"/>
<!-- Anotar Sí → Ingresar Reps -->
<line class="arrow-yes" x1="740" y1="490" x2="800" y2="490"/>
<line class="arrow" x1="800" y1="490" x2="800" y2="528"/>
<!-- Anotar No → Marcar Rutina? -->
<line class="arrow-no" x1="700" y1="510" x2="700" y2="548"/>

<!-- Guardar Reps -->
<line class="arrow" x1="800" y1="568" x2="800" y2="608"/>

<line class="arrow" x1="700" y1="648" x2="700" y2="688"/>

<!-- Notificaciones → Ver Pagos -->

<!-- Pagos? -->
<line class="arrow" x1="860" y1="438" x2="860" y2="468"/>

<line class="arrow-no" x1="900" y1="480" x2="940" y2="480"/>
<line class="arrow" x1="940" y1="480" x2="940" y2="528"/>

<!-- Registrar Cliente → Formulario -->
<line class="arrow" x1="780" y1="358" x2="780" y2="398"/>
<!-- Formulario → Guardar -->
<line class="arrow" x1="780" y1="438" x2="780" y2="478"/>

<line class="arrow" x1="1020" y1="358" x2="1020" y2="398"/>
<!-- Perfil → Rutinas Pendientes -->

<!-- Cerrar Sesión → Fin -->
<line class="arrow" x1="940" y1="358" x2="940" y2="398"/>

<div id="tip"></div>

<script>
// ── Anime.js entrance animation ──
const nodes = document.querySelectorAll('.node');
anime({
  targets: nodes,
  opacity:[0,1],
  translateY:[20,0],
  delay: anime.stagger(30),
  duration:600,
  easing:'easeOutExpo'
});

// ── Line draw animation ──
const lines = document.querySelectorAll('line,path');
lines.forEach(l=>{
  const len = l.getTotalLength ? l.getTotalLength() : 100;
  l.style.strokeDasharray = len;
  l.style.strokeDashoffset = len;
});
anime({
  targets:'line,path',
  strokeDashoffset:[anime.stagger([600,0], {from:'last'}), 0],
  duration:1200,
  delay:200,
  easing:'easeInOutQuart'
});

// ── Hover glow pulse ──
nodes.forEach(n=>{
  n.addEventListener('mouseenter',()=>{
    anime({targets:n,scale:1.06,duration:200,easing:'easeOutQuad'});
    showTip(event, n.dataset.tip);
  });
  n.addEventListener('mousemove', e=>moveTip(e));
  n.addEventListener('mouseleave',()=>{
    anime({targets:n,scale:1,duration:200,easing:'easeOutQuad'});
    hideTip();
  });
});

// ── Tooltip ──
const tip = document.getElementById('tip');
function showTip(e,t){if(!t)return;tip.textContent=t;tip.style.opacity=1}
function moveTip(e){tip.style.left=e.clientX+14+'px';tip.style.top=e.clientY-30+'px'}
function hideTip(){tip.style.opacity=0}
</script>
