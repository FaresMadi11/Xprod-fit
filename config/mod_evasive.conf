# ══════════════════════════════════════════════════════════════
#  Xprod Fit — Configuración mod_evasive para Apache en Linux
#  
#  INSTRUCCIONES DE INSTALACIÓN (servidor Linux/Ubuntu/Debian):
#  1. sudo apt-get install libapache2-mod-evasive
#  2. sudo a2enmod evasive
#  3. Copiar este archivo a: /etc/apache2/mods-enabled/evasive.conf
#  4. sudo systemctl reload apache2
#
#  NOTA: Este módulo NO está disponible en XAMPP Windows.
#  En XAMPP se usa el Rate Limiter PHP (core/rate_limiter.php).
# ══════════════════════════════════════════════════════════════

<IfModule mod_evasive20.c>
    # Umbral de peticiones al mismo recurso en el intervalo de página
    DOSHashTableSize      3097
    DOSPageCount          5
    DOSSiteCount          50

    # Intervalos de tiempo (segundos)
    DOSPageInterval       1
    DOSSiteInterval       1

    # Tiempo de bloqueo en segundos (15 minutos)
    DOSBlockingPeriod     900

    # Email de notificación (cambiar por el real)
    # DOSEmailNotify        admin@xprodfit.com

    # Archivo de log de IPs bloqueadas
    DOSLogDir             /var/log/apache2/mod_evasive

    # IP whitelist — nunca bloquear estas IPs (añadir IP del admin)
    DOSWhitelist          127.0.0.1
    # DOSWhitelist        TU.IP.ADMIN.AQUI

    # Comando a ejecutar cuando se detecta un ataque (opcional)
    # DOSSystemCommand    "su - nobody -s /bin/sh -c 'echo %s >> /var/log/dos_attacks.log'"
</IfModule>
